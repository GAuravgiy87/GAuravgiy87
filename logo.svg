<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Smooth gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#ec4899;#6366f1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#6366f1;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1">
        <animate attributeName="stop-color" values="#ec4899;#6366f1;#8b5cf6;#ec4899" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="200" fill="#0f172a" rx="20"/>
  
  <!-- Decorative grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="50" x2="600" y2="50" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="150" x2="600" y2="150" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="200" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Left decorative element -->
  <g transform="translate(60, 100)">
    <!-- Animated circle -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#textGrad)" stroke-width="2" opacity="0.6" filter="url(#glow)">
      <animate attributeName="r" values="35;38;35" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="10s"
        repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0 176;88 88;176 0;0 176" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Code symbol -->
    <text x="0" y="10" font-family="'Fira Code', monospace" font-size="32" font-weight="600" fill="url(#textGrad)" text-anchor="middle" filter="url(#textGlow)">
      &lt;/&gt;
    </text>
  </g>
  
  <!-- Main text -->
  <g transform="translate(300, 100)">
    <!-- Name -->
    <text x="0" y="-15" 
          font-family="'Inter', 'SF Pro Display', sans-serif" 
          font-size="48" 
          font-weight="700" 
          fill="url(#textGrad)" 
          text-anchor="middle"
          letter-spacing="2"
          filter="url(#textGlow)">
      GAURAV SINGH
    </text>
    
    <!-- Underline animation -->
    <line x1="-140" y1="-5" x2="140" y2="-5" stroke="url(#textGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0 280;280 0" dur="2s" fill="freeze"/>
    </line>
    
    <!-- Subtitle -->
    <text x="0" y="25" 
          font-family="'Fira Code', monospace" 
          font-size="16" 
          font-weight="400" 
          fill="#94a3b8" 
          text-anchor="middle"
          letter-spacing="1">
      Full Stack Developer • Game Dev • 3D Artist
    </text>
    
    <!-- Animated dots -->
    <g>
      <circle cx="-50" cy="45" r="2" fill="url(#accentGrad)" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="45" r="2" fill="url(#textGrad)" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      </circle>
      <circle cx="50" cy="45" r="2" fill="url(#accentGrad)" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1.4s"/>
      </circle>
    </g>
  </g>
  
  <!-- Right decorative element -->
  <g transform="translate(540, 100)">
    <!-- Rotating square -->
    <rect x="-25" y="-25" width="50" height="50" fill="none" stroke="url(#textGrad)" stroke-width="2" opacity="0.5" rx="5" filter="url(#glow)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="15s"
        repeatCount="indefinite"/>
    </rect>
    
    <!-- Inner rotating square -->
    <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" rx="3">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 0 0"
        to="0 0 0"
        dur="10s"
        repeatCount="indefinite"/>
    </rect>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="url(#textGrad)" filter="url(#glow)">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Corner accents -->
  <circle cx="30" cy="30" r="3" fill="url(#accentGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="570" cy="30" r="3" fill="url(#textGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <circle cx="30" cy="170" r="3" fill="url(#textGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="2s"/>
  </circle>
  
  <circle cx="570" cy="170" r="3" fill="url(#accentGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Floating particles -->
  <circle cx="200" cy="50" r="1.5" fill="#ffffff" opacity="0.3">
    <animate attributeName="cy" values="50;60;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="400" cy="150" r="1.5" fill="#ffffff" opacity="0.3">
    <animate attributeName="cy" values="150;140;150" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>